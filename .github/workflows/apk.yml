name: Build APK

# Fork-only pipeline. Upstream's release.yml expects Play/fastlane secrets and a tag; this
# builds one signed release APK and keeps it on a rolling release so it can be downloaded
# without a GitHub login. The signing key comes from repo secrets, so successive builds
# upgrade each other in place.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        # android-actions/setup-android@v3 fails on the retired "tools" package
        # ("Failed to find package 'tools'"), so use the SDK the runner image already
        # ships and just put it on PATH.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CLT="$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"
          echo "$CLT" >> "$GITHUB_PATH"
          echo "$CLT" > /tmp/clt_path

      - name: Install NDK + CMake (whisper.cpp + llama.cpp native modules)
        # NDK 29 still ships under Google's "Preview" licence, which the runner image has not
        # pre-accepted, so sdkmanager stops at an unanswerable Accept? (y/N) prompt. Accept
        # everything first, and fall back to sudo when the image's SDK dir is root-owned.
        run: |
          SM="$(cat /tmp/clt_path)/sdkmanager"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SUDO=""
          if ! touch "$SDK/licenses/.write-test" 2>/dev/null; then SUDO="sudo"; fi
          rm -f "$SDK/licenses/.write-test" 2>/dev/null || true
          printf 'y\n%.0s' {1..300} | $SUDO "$SM" --licenses > /dev/null 2>&1 || true
          printf 'y\n%.0s' {1..300} | $SUDO "$SM" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;25.1.8937393" "ndk;29.0.13113456" "cmake;3.22.1" "cmake;3.31.6"

      - name: Fetch vendored sherpa-onnx AAR (on-device Parakeet STT; gitignored binary)
        working-directory: android
        run: |
          mkdir -p app/libs
          curl -fSL --retry 3 -o app/libs/sherpa-onnx-static-link-onnxruntime-1.13.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-static-link-onnxruntime-1.13.3.aar

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.OPENWISPR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::OPENWISPR_KEYSTORE_BASE64 is not set on this repo."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          OPENWISPR_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OPENWISPR_KEYSTORE_PASSWORD: ${{ secrets.OPENWISPR_KEYSTORE_PASSWORD }}
          OPENWISPR_KEY_ALIAS: ${{ secrets.OPENWISPR_KEY_ALIAS }}
          OPENWISPR_KEY_PASSWORD: ${{ secrets.OPENWISPR_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/OpenWispr-volkey.apk
          ls -la dist

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete volkey-latest --yes --cleanup-tag || true
          gh release create volkey-latest dist/OpenWispr-volkey.apk --latest \
            --title "OpenWispr volkey - ${{ github.sha }}" \
            --notes-file FORK.md
          gh release view volkey-latest --json url,assets --jq '.url, (.assets[] | .name)'
